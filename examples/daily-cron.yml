# Copy this file into the calling repository as .github/workflows/daily-cron.yml.
# It is an example and does not run in higgsfield-action itself.
# schedule spends Higgsfield credits on every tick, even when nothing changed.
# Run workflow_dispatch once and check the cost before leaving the schedule enabled.

name: Daily Higgsfield image

on:
  schedule:
    # 00:00 UTC every day.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate image
        id: higgsfield
        uses: AoziruCake/higgsfield-action@v1
        with:
          api-key: ${{ secrets.HIGGSFIELD_API_KEY }}
          prompt-file: prompts/daily.txt
          output: output/daily.png

      # Video: set model to bytedance/seedance-2.5/text-to-video, output to a
      # .mp4 path, and timeout to 20m or more. Raise timeout-minutes above too.
