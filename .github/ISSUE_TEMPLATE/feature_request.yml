name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem and the change you want. Video models, webhooks, and extra Soul parameters are plausible future work — be specific if you can.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What is hard or missing today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like the Action to behave? New inputs/outputs?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workflows, scripts, or other Actions you tried

  - type: checkboxes
    id: scope
    attributes:
      label: Scope (optional)
      options:
        - label: Image generation (Soul / other models)
        - label: Video generation
        - label: Documentation only
        - label: CI / release / packaging
