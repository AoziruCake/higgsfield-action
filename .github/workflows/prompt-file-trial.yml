# Manual trial for prompt-file on this branch. It does not run on push.
# Each run spends the caller's Higgsfield credits.
# uses: ./ so the workflow runs the Action in the selected branch, not @v1.

name: Prompt file trial

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate from prompt file
        id: higgsfield
        uses: ./
        with:
          api-key: ${{ secrets.HIGGSFIELD_API_KEY }}
          prompt-file: prompts/trial.txt
          output: output/trial.png
          timeout: 15m

      - name: Verify file exists
        env:
          OUTPUT_PATH: ${{ steps.higgsfield.outputs.output-path }}
        run: |
          set -euo pipefail
          case "$OUTPUT_PATH" in
            /*|..|../*|*/../*|*/..)
              echo "output-path must be workspace-relative" >&2
              exit 1
              ;;
          esac
          test -f "$GITHUB_WORKSPACE/$OUTPUT_PATH"
          test -f "$GITHUB_WORKSPACE/prompts/trial.txt"

      - name: Print outputs
        env:
          REQUEST_ID: ${{ steps.higgsfield.outputs.request-id }}
          IMAGE_URL: ${{ steps.higgsfield.outputs.image-url }}
          VIDEO_URL: ${{ steps.higgsfield.outputs.video-url }}
          OUTPUT_PATH: ${{ steps.higgsfield.outputs.output-path }}
        run: |
          printf 'request-id=%s\n' "$REQUEST_ID"
          printf 'image-url=%s\n' "$IMAGE_URL"
          printf 'video-url=%s\n' "$VIDEO_URL"
          printf 'output-path=%s\n' "$OUTPUT_PATH"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: higgsfield-prompt-file
          path: ${{ steps.higgsfield.outputs.output-path }}
