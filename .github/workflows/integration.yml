name: Integration

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Prompt sent to the model
        required: false
        default: "A cat programming in Go"
      output:
        description: Output path (workspace-relative)
        required: false
        default: output/integration.png
      model:
        description: Model endpoint path. Use bytedance/seedance-2.5/text-to-video for a video run.
        required: false
        default: higgsfield-ai/soul/v2/standard
      duration:
        description: Duration in seconds for Seedance 2.5 text-to-video. Leave empty for images.
        required: false
        default: ""

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate
        id: higgsfield
        uses: ./
        with:
          api-key: ${{ secrets.HIGGSFIELD_API_KEY }}
          prompt: ${{ inputs.prompt }}
          output: ${{ inputs.output }}
          model: ${{ inputs.model }}
          duration: ${{ inputs.duration }}
          timeout: 15m

      - name: Verify file exists
        run: |
          set -euo pipefail
          rel="${{ steps.higgsfield.outputs.output-path }}"
          case "$rel" in
            /*)
              echo "output-path must be workspace-relative, got $rel" >&2
              exit 1
              ;;
          esac
          test -f "$GITHUB_WORKSPACE/$rel"
          test -f "$GITHUB_WORKSPACE/${{ inputs.output }}"

      - name: Print outputs
        run: |
          echo "request-id=${{ steps.higgsfield.outputs.request-id }}"
          echo "image-url=${{ steps.higgsfield.outputs.image-url }}"
          echo "video-url=${{ steps.higgsfield.outputs.video-url }}"
          echo "output-path=${{ steps.higgsfield.outputs.output-path }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.higgsfield.outputs.video-url && 'higgsfield-video' || 'higgsfield-image' }}
          path: ${{ inputs.output }}
