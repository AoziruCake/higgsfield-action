name: Integration

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Prompt sent to the model
        required: false
        default: "A cat programming in Go"
      output:
        description: Output path (workspace-relative)
        required: false
        default: output/integration.png
      model:
        description: Model endpoint path. Use bytedance/seedance-2.5/text-to-video for a video run.
        required: false
        default: higgsfield-ai/soul/v2/standard
      duration:
        description: Duration in seconds for Seedance 2.5 text-to-video. Leave empty for images.
        required: false
        default: ""

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate
        id: higgsfield
        uses: ./
        with:
          api-key: ${{ secrets.HIGGSFIELD_API_KEY }}
          prompt: ${{ inputs.prompt }}
          output: ${{ inputs.output }}
          model: ${{ inputs.model }}
          duration: ${{ inputs.duration }}
          timeout: 15m

      - name: Verify file exists
        env:
          OUTPUT_PATH: ${{ steps.higgsfield.outputs.output-path }}
          REQUESTED_OUTPUT: ${{ inputs.output }}
        run: |
          set -euo pipefail
          case "$OUTPUT_PATH" in
            /*|..|../*|*/../*|*/..)
              echo "output-path must be workspace-relative" >&2
              exit 1
              ;;
          esac
          case "$REQUESTED_OUTPUT" in
            /*|..|../*|*/../*|*/..)
              echo "output must be workspace-relative" >&2
              exit 1
              ;;
          esac
          test -f "$GITHUB_WORKSPACE/$OUTPUT_PATH"
          test -f "$GITHUB_WORKSPACE/$REQUESTED_OUTPUT"

      - name: Print outputs
        env:
          REQUEST_ID: ${{ steps.higgsfield.outputs.request-id }}
          IMAGE_URL: ${{ steps.higgsfield.outputs.image-url }}
          VIDEO_URL: ${{ steps.higgsfield.outputs.video-url }}
          OUTPUT_PATH: ${{ steps.higgsfield.outputs.output-path }}
        run: |
          printf 'request-id=%s\n' "$REQUEST_ID"
          printf 'image-url=%s\n' "$IMAGE_URL"
          printf 'video-url=%s\n' "$VIDEO_URL"
          printf 'output-path=%s\n' "$OUTPUT_PATH"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.higgsfield.outputs.video-url && 'higgsfield-video' || 'higgsfield-image' }}
          path: ${{ steps.higgsfield.outputs.output-path }}
